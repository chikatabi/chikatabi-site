<style>
/* トップページ（暫定）。記事サイトを作るときに全面的に置き換える前提。
   配色・書体は /sfc/ のツールと揃えてある */
:root {
  --ground:#E9EDF1; --surface:#FFFFFF; --line:#CDD7E0; --line-strong:#A9B7C4;
  --ink:#0F141A; --muted:#58687A; --accent:#0D6469; --accent-soft:#E0EDEE;
  --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic Medium","Yu Gothic",Meiryo,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Hiragino Sans",monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --ground:#0E1318; --surface:#161D24; --line:#29343F; --line-strong:#3D4C59;
          --ink:#E4EBF2; --muted:#93A3B4; --accent:#4FB3B9; --accent-soft:#14282B; }
}
:root[data-theme="dark"] { --ground:#0E1318; --surface:#161D24; --line:#29343F; --line-strong:#3D4C59;
  --ink:#E4EBF2; --muted:#93A3B4; --accent:#4FB3B9; --accent-soft:#14282B; }
:root[data-theme="light"] { --ground:#E9EDF1; --surface:#FFFFFF; --line:#CDD7E0; --line-strong:#A9B7C4;
  --ink:#0F141A; --muted:#58687A; --accent:#0D6469; --accent-soft:#E0EDEE; }

* { box-sizing:border-box; }
body { margin:0; background:var(--ground); color:var(--ink); font-family:var(--sans);
       font-size:16px; line-height:1.75; -webkit-text-size-adjust:100%; }
.wrap { max-width:640px; margin:0 auto; padding:44px 18px 72px; display:flex; flex-direction:column; gap:26px; }
.eyebrow { font-family:var(--mono); font-size:11px; letter-spacing:.16em; color:var(--muted); margin:0; }
h1 { font-size:clamp(24px,6vw,33px); line-height:1.35; letter-spacing:-.015em; margin:7px 0 0; text-wrap:balance; }
.lede { color:var(--muted); font-size:14.5px; margin:11px 0 0; }
h2 { font-size:15px; margin:0; }
p { margin:0; }

.card { background:var(--surface); border:1px solid var(--line); border-radius:10px;
        padding:20px 18px; display:flex; flex-direction:column; gap:13px; }
.card-note { font-size:13px; color:var(--muted); line-height:1.7; }
.btn { display:block; text-align:center; padding:13px 16px; border-radius:8px; text-decoration:none;
       font-size:14.5px; font-weight:700; border:1px solid var(--accent); color:var(--accent);
       background:transparent; transition:background .14s ease; }
.btn:hover { background:var(--accent-soft); }
.btn.primary { background:var(--accent); color:var(--surface); }
.btn.primary:hover { background:color-mix(in srgb, var(--accent) 86%, black); }
.btn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.links { display:flex; flex-direction:column; gap:9px; }
footer { font-size:11.5px; color:var(--muted); line-height:1.75; }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
