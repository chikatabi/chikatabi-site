<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E2347">
<title>空の通い帳｜ANAフライトログ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="brand">
      <div class="seal" aria-hidden="true">通</div>
      <div>
        <h1>空の通い帳</h1>
        <p class="sub">ANAのフライトログ<span class="proto">試作</span></p>
      </div>
    </div>
    <div class="yearbar">
      <button class="yr" id="prevYear" aria-label="前の年">‹</button>
      <span id="yearLabel"></span>
      <button class="yr" id="nextYear" aria-label="次の年">›</button>
    </div>
    <div id="heroNum" class="hero-num"></div>
  </div>
</header>

<main class="wrap" id="home">
  <section class="card summary" id="summary"></section>
  <section id="logList" class="log"></section>

  <details class="card settings">
    <summary>マイルの計算の設定</summary>
    <label>今のステイタス<select id="statusSel"></select></label>
    <label>お持ちのANAカード<select id="cardSel"></select></label>
    <p class="note">ボーナスマイルの計算に使います。PPには影響しません。</p>
    <button class="ghost small" id="sampleBtn">見本の記録を入れる</button>
    <button class="ghost small danger" id="clearBtn">記録を全部消す</button>
    <p class="note">試作のあいだ、記録と写真はこの端末のブラウザの中だけに保存されます。</p>
  </details>

  <p class="foot">ANA・ANAマイレージクラブとは関係のない、CHIKATABIの非公式アプリです。PPとマイルは公式の積算ルール（2026年5月19日以降）で計算した見込みで、正式な数字はANAの「ご利用実績照会」で確かめてください。</p>
</main>

<button class="fab" id="newBtn">＋ 記録する</button>

<!-- 記録の入力画面 -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-head">
    <button class="ghost" id="closeBtn">閉じる</button>
    <strong id="sheetTitle">記録する</strong>
    <button class="primary small" id="saveBtn">保存</button>
  </div>
  <form class="sheet-body wrap" id="form" autocomplete="off">

    <section class="memory">
      <canvas id="cardCanvas" aria-label="思い出の1枚"></canvas>
      <div class="memory-btns">
        <label class="pill"><input type="file" id="photoInput" accept="image/*">🖼 写真を選ぶ</label>
        <button type="button" class="pill" id="photoRemove" hidden>写真を外す</button>
        <button type="button" class="pill strong" id="shareBtn">思い出の1枚を保存</button>
      </div>
    </section>

    <fieldset>
      <legend>フライトの感想</legend>
      <div class="faces" id="faces" role="radiogroup" aria-label="フライトの感想"></div>
      <div class="sign-head">
        <span>Signature</span>
        <button type="button" class="pill" id="signClear">書き直す</button>
      </div>
      <canvas class="signpad" id="signPad" aria-label="Signature を書く欄"></canvas>
      <p class="note">指やペンで書けます。思い出の1枚の左下にも載ります。</p>
    </fieldset>

    <label class="scan">
      <input type="file" id="scanInput" accept="image/*">
      <span>搭乗券のスクリーンショットから入れる</span>
      <small>日付・便名・区間・座席が入ります。違っていたら直してください。</small>
    </label>
    <p class="scanmsg" id="scanMsg" hidden></p>

    <fieldset>
      <legend>基本</legend>
      <div class="row2">
        <label>日付<input type="date" name="date" required></label>
        <label>便名<input name="flightNo" placeholder="NH794" autocapitalize="characters"></label>
      </div>
      <label>種類<select name="kind" id="kindSel"></select></label>

      <div class="row2" data-show="domestic intlDom">
        <label>出発<select name="from" id="fromSel"></select></label>
        <label>到着<select name="to" id="toSel"></select></label>
      </div>
      <div class="row2" data-show="intl">
        <label>日本側<select name="japan" id="japanSel"></select></label>
        <label>海外側<select name="foreign" id="foreignSel"></select></label>
      </div>
      <div class="row2">
        <label>出発の空港コード<input name="fromCode" placeholder="OIT" maxlength="3" autocapitalize="characters"></label>
        <label>到着の空港コード<input name="toCode" placeholder="HND" maxlength="3" autocapitalize="characters"></label>
      </div>

      <div class="row2" data-show="domestic">
        <label>クラス<select name="seat" id="seatSel"></select></label>
        <label>運賃の種類<select name="fare" id="fareSel"></select></label>
      </div>
      <label class="check" data-show="domestic"><input type="checkbox" name="paidUpgrade"> 当日、お金を払ってファーストクラスにアップグレードした</label>
      <label data-show="intlDom intl">予約クラス<select name="cls" id="clsSel"></select></label>
      <label>座席<input name="seatNo" placeholder="5H" autocapitalize="characters"></label>

      <div class="pp" id="ppPreview"></div>
    </fieldset>

    <fieldset>
      <legend>機体</legend>
      <div class="row2">
        <label>機材<input name="aircraft" placeholder="B787-8"></label>
        <label>機体記号<input name="registration" placeholder="JA801A" autocapitalize="characters"></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>時刻</legend>
      <div class="row2">
        <label>搭乗口<input name="gate" placeholder="3B"></label>
        <label>遅延<input name="delay" placeholder="15分"></label>
      </div>
      <div class="row2">
        <label>実際の出発<input type="time" name="depActual"></label>
        <label>実際の到着<input type="time" name="arrActual"></label>
      </div>
      <label>飛行時間<input name="flightTime" placeholder="1時間25分"></label>
    </fieldset>

    <fieldset>
      <legend>飛行</legend>
      <div class="row2">
        <label>離陸した滑走路<input name="runwayDep" placeholder="RWY01"></label>
        <label>着陸した滑走路<input name="runwayArr" placeholder="RWY34R"></label>
      </div>
      <label>巡航高度<input name="cruiseAlt" placeholder="37,000ft"></label>
    </fieldset>

    <fieldset>
      <legend>思い出</legend>
      <div class="row2">
        <label>天気<input name="weather" placeholder="晴れ"></label>
        <label>ラウンジ<input name="lounge" placeholder="ANA SUITE LOUNGE"></label>
      </div>
      <label>メモ<textarea name="memo" rows="3" placeholder="富士山がよく見えた"></textarea></label>
    </fieldset>

    <button type="button" class="ghost danger" id="deleteBtn" hidden>この記録を消す</button>
  </form>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
